# /etc/nginx/sites-available/ravza
# ALAN-ADINIZ.com.tr yerine kendi alan adınızı yazın. Alt alan adı
# kullanacaksanız (ör. randevu.ALAN-ADINIZ.com.tr) server_name'e yalnız onu yazın.
# HTTPS satırlarını certbot kendisi ekler: sudo certbot --nginx

server {
    listen 80;
    listen [::]:80;
    server_name ALAN-ADINIZ.com.tr www.ALAN-ADINIZ.com.tr;

    # Panelden Excel yolcu listesi yüklenebilsin.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uygulama istemci IP'sini bu başlıklardan okur (hız sınırları için).
        # İstemcinin gönderdiği değerin üzerine yazılır, taklit edilemez.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
