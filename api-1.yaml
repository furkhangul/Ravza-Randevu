          type: string
          nullable: true
        surname:
          type: string
          nullable: true
        groupCode:
          type: string
          nullable: true
        appointmentDate:
          type: string
          format: date-time
          nullable: true
        appointmentTime:
          type: string
          nullable: true
        appointmentStatus:
          $ref: "#/components/schemas/AppointmentStatus"
        genderId:
          $ref: "#/components/schemas/Gender"
        gender:
          type: string
          nullable: true
