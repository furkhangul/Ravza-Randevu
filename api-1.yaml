      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          nullable: true
      additionalProperties: false
      description: "Standard partner API error payload (`success: false`)."
    PurchaseAppointmentsPoolRequest:
      type: object
      properties:
        dateKey:
